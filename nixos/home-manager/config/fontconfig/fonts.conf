<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="append"><const>hintslight</const></edit>  <!-- or hintmedium / hintfull -->
    <edit name="rgba" mode="assign"><const>none</const></edit>  <!-- rgb, bgr, vrgb, vbgr – match your monitor subpixel layout -->
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <test name="pixelsize" compare="less">
      <double>14.0</double>
    </test>

    <edit name="embolden" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
