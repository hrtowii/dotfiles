$mainMod = Alt_R

# === Application launching ===
bind = $mainMod, Return, exec, ghostty
bind = $mainMod SHIFT, Return, exec, firefox
bind = $mainMod CTRL, Return, exec, code
bind = $mainMod, C, exec, code
bind = $mainMod SHIFT, N, exec, thunar
bind = SUPER, SPACE, exec, wofi --show drun

# === System commands ===
bind = SUPER, Q, killactive,
bind = $mainMod, Escape, exec, swaylock
bind = $mainMod SHIFT, S, exec, systemctl suspend
bind = $mainMod, M, exec, wlogout --protocol layer-shell

# === Window navigation (WASD) ===
bind = $mainMod, A, movefocus, l
bind = $mainMod, S, movefocus, d
bind = $mainMod, W, movefocus, u
bind = $mainMod, D, movefocus, r

# === Window navigation (arrows) ===
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# === Window moving/warping (WASD) ===
bind = $mainMod SHIFT, A, movewindow, l
bind = $mainMod SHIFT, S, movewindow, d
bind = $mainMod SHIFT, W, movewindow, u
bind = $mainMod SHIFT, D, movewindow, r

# === Window moving/warping (arrows) ===
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# === Workspace navigation ===
bind = $mainMod, Tab, workspace, +1
bind = $mainMod SHIFT, Tab, workspace, -1
bind = $mainMod, X, workspace, previous
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# === Create/destroy workspaces ===
bind = $mainMod, N, exec, hyprctl dispatch workspace empty
bind = $mainMod SHIFT, D, exec, hyprctl dispatch workspace empty && hyprctl dispatch movetoworkspace empty

# === Move window to workspace ===
bind = $mainMod SHIFT, X, movetoworkspace, previous
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# === Move window and follow to workspace ===
bind = $mainMod CTRL, M, movetoworkspace, +1
bind = $mainMod CTRL, P, movetoworkspace, -1
bind = $mainMod CTRL, N, movetoworkspace, +1
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4

# === Window management ===
bind = $mainMod, E, exec, hyprctl dispatch splitratio exact 1
bind = $mainMod, V, togglefloating,
bind = $mainMod, H, layoutmsg, preselect r
bind = $mainMod, V, layoutmsg, preselect d
bind = $mainMod, F, fullscreen, 1
bind = $mainMod ALT SHIFT, F, fullscreen, 0

# === Window resizing ===
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, down, resizeactive, 0 50
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, right, resizeactive, 50 0

# === Mirror/rotate ===
bind = ALT SHIFT, X, layoutmsg, orientationnext
bind = ALT SHIFT, Y, layoutmsg, orientationprev

# === Screenshot ===
bind = , PRINT, exec, hyprshot -m region --clipboard-only

# === Mouse bindings ===
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
