$mainMod = Alt_R

# === Application launching ===
binds = $mainMod, Return, exec, ghostty
binds = $mainMod SHIFT, Return, exec, firefox
# binds = $mainMod CTRL, Return, exec, code
# binds = $mainMod, C, exec, code
binds = $mainMod SHIFT, N, exec, dolphin
bind = SUPER, SPACE, exec, wofi --show drun

# === System commands ===
bind = SUPER, Q, killactive,
binds = $mainMod, Escape, exec, swaylock
binds = $mainMod SHIFT, S, exec, systemctl suspend
binds = $mainMod, M, exec, wlogout --protocol layer-shell

# === Window navigation (WASD) ===
binds = $mainMod, A, movefocus, l
binds = $mainMod, S, movefocus, d
binds = $mainMod, W, movefocus, u
binds = $mainMod, D, movefocus, r

# === Window navigation (arrows) ===
binds = $mainMod, left, movefocus, l
binds = $mainMod, down, movefocus, d
binds = $mainMod, up, movefocus, u
binds = $mainMod, right, movefocus, r

# === Window moving/warping (WASD) ===
bind = $mainMod SHIFT, A, movewindow, l
bind = $mainMod SHIFT, S, movewindow, d
bind = $mainMod SHIFT, W, movewindow, u
bind = $mainMod SHIFT, D, movewindow, r

# === Window moving/warping (arrows) ===
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# === Workspace navigation ===
#binds = $mainMod, Tab, workspace, +1
#binds = $mainMod SHIFT, Tab, workspace, -1
binds = $mainMod, Tab, cyclenext
binds = $mainMod, X, workspace, previous
binds = $mainMod, 1, workspace, 1
binds = $mainMod, 2, workspace, 2
binds = $mainMod, 3, workspace, 3
binds = $mainMod, 4, workspace, 4
binds = $mainMod, 5, workspace, 5
binds = $mainMod, 6, workspace, 6
binds = $mainMod, 7, workspace, 7
binds = $mainMod, 8, workspace, 8
binds = $mainMod, 9, workspace, 9

# === Create/destroy workspaces ===
binds = $mainMod, N, exec, hyprctl dispatch workspace empty
bind = $mainMod SHIFT, D, exec, hyprctl dispatch workspace empty && hyprctl dispatch movetoworkspace empty

# === Move window to workspace ===
bind = $mainMod SHIFT, X, movetoworkspace, previous
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# === Move window and follow to workspace ===
binds = $mainMod CTRL, M, movetoworkspace, +1
binds = $mainMod CTRL, P, movetoworkspace, -1
binds = $mainMod CTRL, N, movetoworkspace, +1
binds = $mainMod CTRL, 1, movetoworkspace, 1
binds = $mainMod CTRL, 2, movetoworkspace, 2
binds = $mainMod CTRL, 3, movetoworkspace, 3
binds = $mainMod CTRL, 4, movetoworkspace, 4

# === Window management ===
binds = $mainMod, E, exec, hyprctl dispatch splitratio exact 1
binds = $mainMod, V, togglefloating,
binds = $mainMod, H, layoutmsg, preselect r
binds = $mainMod, V, layoutmsg, preselect d
binds = $mainMod, F, fullscreen, 1
binds = $mainMod ALT SHIFT, F, fullscreen, 0

# === Window resizing ===
binds = $mainMod CTRL, left, resizeactive, -10 0
binds = $mainMod CTRL, down, resizeactive, 0 10
binds = $mainMod CTRL, up, resizeactive, 0 -10
binds = $mainMod CTRL, right, resizeactive, 10 0

# resize mode
binds = $mainMod, R,submap,resize
submap=resize
bind = , right, resizeactive, 10 0
bind = , left, resizeactive, -10 0
bind = , up, resizeactive, 0 -10
bind = , down, resizeactive, 0 10
bind = , Return,submap,reset
bind = , Esc,submap,reset
submap=reset

# === Mirror/rotate ===
bind = ALT SHIFT, X, layoutmsg, orientationnext
bind = ALT SHIFT, Y, layoutmsg, orientationprev

# === Screenshot ===
bind = SUPER SHIFT, S, exec, hyprshot -m region --clipboard-only

# === Mouse bindings ===
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
