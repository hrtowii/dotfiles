[theme]
theme = "solarized-dark" 
[theme.overrides]
file = "~/.config/i3status-rust/theme.toml"

[icons]
icons = "none"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 60
warning = 20.0
alert = 10.0

[[block]]
block = "memory"
format = " $icon $mem_used_percents "
format_alt = " $icon $swap_used_percents "

[[block]]
block = "cpu"
interval = 1

[[block]]
block = "load"
interval = 1
format = " $icon $1m "

[[block]]
block = "sound"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %d/%m %R') "
