[theme]
theme = "solarized-dark" 
[theme.overrides]
# Start flavours
idle_bg = "#312751"
idle_fg = "#e1d6e1"
info_bg = "#a255d1"
info_fg = "#e1d6e1"
good_bg = "#a178e5"
good_fg = "#312751"
warning_bg = "#ae3df4"
warning_fg = "#312751"
critical_bg = "#d4fcc4"
critical_fg = "#312751"
alternating_tint_bg = "#776d8b"
# End flavours

[icons]
icons = "none"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 60
warning = 20.0
alert = 10.0

[[block]]
block = "memory"
format = " $icon $mem_used_percents "
format_alt = " $icon $swap_used_percents "

[[block]]
block = "cpu"
interval = 1

[[block]]
block = "load"
interval = 1
format = " $icon $1m "

[[block]]
block = "sound"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %d/%m %R') "
