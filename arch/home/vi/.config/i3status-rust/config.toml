[theme]
theme = "solarized-dark" 
[theme.overrides]
# Start flavours
idle_bg = "#1e2442"
idle_fg = "#d0ccd2"
info_bg = "#7171b8"
info_fg = "#d0ccd2"
good_bg = "#687b89"
good_fg = "#1e2442"
warning_bg = "#9b756c"
warning_fg = "#1e2442"
critical_bg = "#707b6c"
critical_fg = "#1e2442"
alternating_tint_bg = "#65677b"
# End flavours

[icons]
icons = "none"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 60
warning = 20.0
alert = 10.0

[[block]]
block = "memory"
format = " $icon $mem_used_percents "
format_alt = " $icon $swap_used_percents "

[[block]]
block = "cpu"
interval = 1

[[block]]
block = "load"
interval = 1
format = " $icon $1m "

[[block]]
block = "sound"

[[block]]
block = "battery"
interval = 10
format = " $icon $percentage "

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %d/%m %R') "
