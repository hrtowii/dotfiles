# Sunbather - Minimal pink colorscheme for Kitty
# Ported from sunbather.vim (dark variant)

# Basic colors
background              #000000
foreground              #C6C6C6
cursor                  #d75f87
cursor_text_color       #000000

# Selection
selection_foreground    #000000
selection_background    #d75f87

# Normal colors (ANSI 0-15)
color0   #000000   # black
color1   #E32791   # red
color2   #5FD7A7   # green
color3   #ffff87   # yellow
color4   #008EC4   # blue
color5   #d75f87   # magenta / pink
color6   #4FB8CC   # cyan
color7   #C6C6C6   # white

color8   #4E4E4E   # bright black
color9   #E32791   # bright red
color10  #5FD7A7   # bright green
color11  #ffff87   # bright yellow
color12  #20BBFC   # bright blue
color13  #ff5f87   # bright magenta (lighter pink)
color14  #4FB8CC   # bright cyan
color15  #F1F1F1   # bright white

# Extended / UI colors
active_border_color     #d75f87
inactive_border_color   #262626
bell_border_color       #ffff87

# Tab bar
active_tab_foreground   #000000
active_tab_background   #d75f87
inactive_tab_foreground #C6C6C6
inactive_tab_background #262626
tab_bar_background      #121212

# URL underline / hints
url_color               #20BBFC

# Dimmed / faint text
dim_opacity             0.75

# Visual / subtle backgrounds
# (Kitty doesn't have direct "bg_subtle", but these help with contrast)
background_opacity      1.0
